name: CI

on:
    push:
        branches: [main]
    pull_request:

jobs:
    check:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: cachix/install-nix-action@v22
              with:
                  nix_path: nixpkgs=channel:nixos-unstable
            - run: nix build .#nixosConfigurations.minotaur.config.system.build.toplevel
            - run: ntest
