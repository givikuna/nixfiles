background {
    path = screenshot
    blur_passes = 2
    blur_size = 7
}

input-field {
    monitor =
    size = 220, 50
    outline_thickness = 3
    dots_size = 0.33
    dots_spacing = 0.15
    outer_color = rgb(50, 48, 47)
    inner_color = rgb(44, 44, 44)
    font_color = rgb(212, 190, 152)
    fade_on_empty = false
    placeholder_text = <i>Enter Password...</i>
    hide_input = false
    position = 0, -20
    halign = center
    valign = center
}

label {
    monitor =
    text = $TIME
    color = rgb(212, 190, 152)
    font_size = 55
    font_family = RobotoMono Nerd Font
    position = 0, 80
    halign = center
    valign = center
}
