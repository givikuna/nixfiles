monitor=,preferred,auto,1

# Launch background apps
exec-once = hyprpaper
exec-once = waybar
exec-once = dunst

$mainMod = SUPER

bind = CONTROL, space, exec, rofi -show drun                            # ctrl + space -> open rofi

bind = CONTROL $mainMod, space, exec, rofi -show drun                   # meta + ctrl + space -> open rofi
bind = $mainMod, q, exec, kitty                                         # meta + q -> open kitty
bind = $mainMod, b, exec, firefox                                       # meta + b -> open firefox
bind = $mainMod, c, killactive                                          # meta + c -> kill window

bind = $mainMod, f, togglefloating                                      # meta + f -> toggle floating

bind = $mainMod SHIFT, left, movefocus, l                               # meta + shift + arrow left -> focus left
bind = $mainMod SHIFT, right, movefocus, r                              # meta + shift + arrow right -> focus right
bind = $mainMod SHIFT, up, movefocus, u                                 # meta + shift + arrow up -> focus up
bind = $mainMod SHIFT, down, movefocus, d                               # meta + shift + arrow down -> focus down

bind = ALT, Tab, exec, rofi -show window                                # alt + tab -> switch window

bind = $mainMod ALT, k, pin                                             # meta + alt + k -> keep window on all workspaces

bind = CONTROL $mainMod ALT, left, movewindowmonitor, l                 # ctrl + meta + left arrow -> move window to the left monitor
bind = CONTROL $mainMod ALT, right, movewindowmonitor, r                # ctrl + meta + right arrow-> move window to the right  monitor

bind = CONTROL $mainMod, left, workspace, r-1                           # meta + ctrl + left arrow -> move to the left monitor
bind = CONTROL $mainMod, right, workspace, r+1                          # meta + ctrl + right arrow -> move to the right monitor

bind = CONTROL $mainMod SHIFT, left, movetoworkspace, r-1               # meta + ctrl + shift + left arrow -> move window to the left workspace
bind = CONTROL $mainMod SHIFT, right, movetoworkspace, r+1              # meta + ctrl + shift + right arrow -> move window to the right workspace

# self explanatory just move to workspace
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9

# move the window there
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9

# move windows around within the tile system
# still very self-explanatory I'm not fucking explaining this
bind = $mainMod, left, movewindow, l
bind = $mainMod, right, movewindow, r
bind = $mainMod, up, movewindow, u
bind = $mainMod, down, movewindow, d
