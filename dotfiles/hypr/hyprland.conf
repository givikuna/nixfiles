monitor=,preferred,auto,1

# Launch background apps
exec-once = hyprpaper
exec-once = waybar
exec-once = dunst
exec-once = hypridle
exec-once = nm-applet --indicator
exec-once = systemctl --user start hyprpolkitagent

exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store

$mainMod = SUPER

# I'm including basic comments for explaining the binds because I WILL forget
# I do NOT want to forget

bind = CONTROL, space, exec, rofi -show drun                            # ctrl + space -> open rofi

bind = $mainMod, l, exec, loginctl lock-screenshot                      # meta + l -> locks screen

bind = CONTROL $mainMod, space, exec, rofi -show drun                   # meta + ctrl + space -> open rofi
bind = $mainMod, q, exec, kitty                                         # meta + q -> open kitty
bind = $mainMod, b, exec, firefox                                       # meta + b -> open firefox
bind = $mainMod, c, killactive                                          # meta + c -> kill window

bind = $mainMod, f, togglefloating                                      # meta + f -> toggle floating

bind = $mainMod SHIFT, left, movefocus, l                               # meta + shift + arrow left -> focus left
bind = $mainMod SHIFT, right, movefocus, r                              # meta + shift + arrow right -> focus right
bind = $mainMod SHIFT, up, movefocus, u                                 # meta + shift + arrow up -> focus up
bind = $mainMod SHIFT, down, movefocus, d                               # meta + shift + arrow down -> focus down

bind = ALT, Tab, exec, rofi -show window                                # alt + tab -> switch window

bind = $mainMod ALT, k, pin                                             # meta + alt + k -> keep window on all workspaces

bind = CONTROL $mainMod ALT, left, movewindowmonitor, l                 # ctrl + meta + left arrow -> move window to the left monitor
bind = CONTROL $mainMod ALT, right, movewindowmonitor, r                # ctrl + meta + right arrow-> move window to the right  monitor

bind = CONTROL $mainMod, left, workspace, r-1                           # meta + ctrl + left arrow -> move to the left monitor
bind = CONTROL $mainMod, right, workspace, r+1                          # meta + ctrl + right arrow -> move to the right monitor

bind = CONTROL $mainMod SHIFT, left, movetoworkspace, r-1               # meta + ctrl + shift + left arrow -> move window to the left workspace
bind = CONTROL $mainMod SHIFT, right, movetoworkspace, r+1              # meta + ctrl + shift + right arrow -> move window to the right workspace

# self explanatory just move to workspace
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9

# move the window there
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9

# move windows around within the tile system
# still very self-explanatory I'm not fucking explaining this
bind = $mainMod, left, movewindow, l
bind = $mainMod, right, movewindow, r
bind = $mainMod, up, movewindow, u
bind = $mainMod, down, movewindow, d

# standard audio binds for keyboard
bind = , XF86AudioPlay,  exec, playerctl play-pause
bind = , XF86AudioNext,  exec, playerctl next
bind = , XF86AudioPrev,  exec, playerctl previous

# logout
bind = $mainMod, Escape, exec, wlogout

# color picker
bind = $mainMod, p, exec, hyprpicker -a



# other settings:



input {
    kb_layout = us
    follow_mouse = 1

    touchpad {
        natural_scroll = true
        tap-to-click = true
    }
}

# audio and brightness
binde = , XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
binde = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bind  = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
binde = , XF86MonBrightnessUp, exec, brightnessctl set 5%+
binde = , XF86MonBrightnessDown, exec, brightnessctl set 5%-

exec-once = swayosd-server

binde = , XF86AudioRaiseVolume, exec, swayosd-client --output-volume raise
binde = , XF86AudioLowerVolume, exec, swayosd-client --output-volume lower
bind  = , XF86AudioMute, exec, swayosd-client --output-volume mute-toggle
binde = , XF86MonBrightnessUp, exec, swayosd-client --brightness raise
binde = , XF86MonBrightnessDown, exec, swayosd-client --brightness lower

# screenshot tool: meta + shift + s
bind = $mainMod SHIFT, s, exec, grim -g "$(slurp)" - | wl-copy

# nvidia config
env = LIBVA_DRIVER_NAME,nvidia
env = XDG_SESSION_TYPE,wayland
env = GBM_BACKEND,nvidia-drm
env = __GLX_VENDOR_LIBRARY_NAME,nvidia

cursor {
    no_hardware_cursors = true
}

# steam clean up
windowrulev2 = float, class:^(steam)$, title:^(Friends List)$
windowrulev2 = float, class:^(steam)$, title:^(Steam - News)$
windowrulev2 = float, class:^(steam)$, title:.*(Chat).*
windowrulev2 = float, class:^(steam)$, title:^(.?Settings.?)$
windowrulev2 = float, class:^(steam)$, title:^(Store - .*)$

# keeps nice stuff
windowrulev2 = float, class:^(pavucontrol)$
windowrulev2 = float, class:^(nm-connection-editor)$
windowrulev2 = float, title:^(Open File)$
windowrulev2 = float, title:^(Choose Folder)$
